services:
  - type: web
    name: zyra-web
    runtime: docker
    plan: standard
    dockerfilePath: Dockerfile
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: zyra-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: zyra-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"

databases:
  - name: zyra-postgres
    databaseName: zyra
    user: zyra_user
    plan: standard

  - name: zyra-redis
    plan: starter
